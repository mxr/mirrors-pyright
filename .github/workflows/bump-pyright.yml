name: bump-pyright

on:
  schedule:
  - cron: 15 8 * * *
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check for new pyright version
      id: check
      run: |
        current="$(grep -oP '__version__ = "\K[^"]+' mirrors_pyright/__init__.py)"
        latest="$(curl -sSf https://registry.npmjs.org/pyright/latest | jq -r .version)"
        echo "current=$current" >> "$GITHUB_OUTPUT"
        echo "latest=$latest" >> "$GITHUB_OUTPUT"
        if [ "$current" != "$latest" ]; then
          echo "new=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Bump version, tag, and push
      if: steps.check.outputs.new == 'true'
      env:
        CURRENT: ${{ steps.check.outputs.current }}
        LATEST: ${{ steps.check.outputs.latest }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sed -i "s/__version__ = \"$CURRENT\"/__version__ = \"$LATEST\"/" mirrors_pyright/__init__.py
        sed -i "s/rev: v$CURRENT/rev: v$LATEST/" README.md
        git config user.name 'Github Actions'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit mirrors_pyright/__init__.py -m "pyright $LATEST"
        git tag "v$LATEST"
        git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
        git push origin HEAD:refs/heads/main --tags
