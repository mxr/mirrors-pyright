[project]
name = "pyright-pre-commit"
description = "pre-commit mirror for pyright with vendored node and npm"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max R", email = "mxr@users.noreply.github.com" }]
keywords = ["mirror", "node", "npm", "pre-commit", "pyright"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/mxr/pyright-pre-commit"

[project.scripts]
pyright = "pyright_pre_commit.__main__:main"

[dependency-groups]
dev = [
  "covdefaults>=2.1.0",
  "coverage",
  "pytest",
]

[build-system]
requires = ["setuptools>=61", "typing_extensions; python_version < '3.12'"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]  # generated by mxr/base
plugins = ["covdefaults"]

[tool.mypy]  # generated by mxr/base
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "testing.*"

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "tests.*"

[tool.ruff]  # generated by mxr/base
target-version = "py311"

[tool.ruff.lint]  # generated by mxr/base
extend-select = [
  "A",  # see flake8-builtins
  "B",  # see flake8-bugbear
  "C4",  # see flake8-comprehension
  "I",  # sort imports
  "SIM",  # see flake8-simplify
  "TC",  # see flake8-type-checking
  "UP",  # see pyupgrade
]

[tool.ruff.lint.isort]  # generated by mxr/base
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.setuptools.dynamic]
version = { attr = "pyright_pre_commit.__version__" }

[tool.setuptools.package-data]
pyright_pre_commit = ["_vendor/**/*", "py.typed"]

[tool.setuptools.packages.find]
include = ["pyright_pre_commit*"]

[tool.tombi]  # generated by mxr/base
offline = true
string-quote-style = "double"

[tool.tox]  # generated by mxr/base
env_list = ["py", "pre-commit"]

[tool.tox.env.pre-commit]  # generated by mxr/base
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit-uv"]
skip_install = true

[tool.tox.env_run_base]  # generated by mxr/base
commands = [
  ["coverage", "erase"],
  ["coverage", "run", "-m", "pytest", "{posargs:tests}"],
  ["coverage", "report"],
]
dependency_groups = ["dev"]

[tool.ty.rules]  # generated by mxr/base
all = "error"
